<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Silky explainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=block" rel="stylesheet">
<!--
  The explainer's picture. Everything on screen is a pure function of time: draw(t) sets every element for
  instant t, so render.mjs can step it frame by frame and a preview can seek anywhere. It follows
  out/timeline.json (make_audio.py): when each phrase and word is spoken, when each recorded take plays and what
  the daemon reported during it. The takes' frames come from the launch film's cut (../out/frames/<shot>/).
    render:   node render.mjs          preview with sound:   node render.mjs --serve
-->
<style>
  :root {
    --blue: #2563EB; --paper: #F8FAFC; --ink: #0F172A; --slate: #64748B; --line: #CBD5E1;
    --soft: #DBEAFE; --mist: #EFF6FF; --card: #FFFFFF; --edge: #E2E8F0;
  }
  html, body { margin: 0; height: 100%; background: #0B1220; overflow: hidden; }
  body { display: grid; place-items: center; font-family: Inter, system-ui, sans-serif; color: var(--ink);
         -webkit-font-smoothing: antialiased; font-feature-settings: "ss01", "cv11"; }
  #stage { position: relative; width: 1920px; height: 1080px; background: var(--paper); overflow: hidden;
           transform-origin: 0 0; flex: none; }
  #stage > * { position: absolute; }
  svg { overflow: visible; }

  /* kinetic type */
  .kl { white-space: nowrap; letter-spacing: -0.035em; line-height: 1.04; font-weight: 800; }
  .kl .w { display: inline-block; margin-right: .24em; will-change: transform, opacity; position: relative; }
  .kl .w:last-child { margin-right: 0; }
  .kl .e { color: var(--blue); }

  /* the Silky overlay, redrawn light for the illustrated scenes */
  #overlay { left: 1430px; top: 56px; width: 434px; height: 152px; background: var(--card); border: 1.5px solid var(--edge);
             border-radius: 22px; box-shadow: 0 18px 50px -18px rgba(15, 23, 42, .25); display: flex; align-items: center;
             gap: 22px; padding: 0 26px; box-sizing: border-box; }
  #overlay .txt { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
  #overlay .name { font: 600 14px Inter; letter-spacing: .18em; color: var(--slate); }
  #overlay .status { font: 600 22px Inter; letter-spacing: -.01em; white-space: nowrap; }
  #overlay .meta { display: flex; gap: 10px; align-items: center; height: 30px; }
  .chip { font: 600 15px Inter; padding: 5px 12px; border-radius: 99px; border: 1.5px solid var(--blue); color: var(--blue);
          background: var(--mist); white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
  .chip.wait { border-style: dashed; color: var(--slate); border-color: var(--line); background: var(--paper); }
  .timing { font: 500 14px Inter; color: var(--slate); font-variant-numeric: tabular-nums; white-space: nowrap; }

  .win { background: var(--card); border: 1.5px solid var(--edge); border-radius: 20px;
         box-shadow: 0 30px 70px -30px rgba(15, 23, 42, .30); overflow: hidden; }
  .bar { height: 50px; border-bottom: 1.5px solid var(--edge); display: flex; align-items: center; gap: 9px; padding: 0 20px;
         font: 600 16px Inter; color: var(--slate); }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--edge); }
  .bubble { font: 500 30px Inter; letter-spacing: -.01em; background: var(--mist); border: 1.5px solid var(--soft);
            color: var(--ink); padding: 18px 26px; border-radius: 26px 26px 26px 8px; display: flex; gap: 14px; align-items: center;
            white-space: nowrap; }
  .label { font: 600 22px Inter; letter-spacing: -.01em; }
  .small { font: 500 17px Inter; color: var(--slate); }
  .num { font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.04em; color: var(--blue); }
  .pill { font: 600 18px Inter; color: #fff; background: var(--blue); padding: 6px 14px; border-radius: 99px; white-space: nowrap; }
  .card { background: var(--card); border: 1.5px solid var(--edge); border-radius: 28px;
          box-shadow: 0 30px 60px -30px rgba(15, 23, 42, .25); }

  /* the recorded takes */
  #take { left: 188px; top: 128px; width: 1544px; height: 820px; border-radius: 24px; overflow: hidden; background: #0B1220;
          box-shadow: 0 40px 90px -40px rgba(15, 23, 42, .55); }
  #take img { position: absolute; left: 0; top: 0; width: 1544px; height: 820px; transform-origin: 0 0; }
  #take .flash { position: absolute; inset: 0; background: #fff; }
  #take .cut { position: absolute; left: 24px; top: 22px; font: 600 16px Inter; color: #fff; background: rgba(15, 23, 42, .78);
               border: 1.5px solid rgba(255, 255, 255, .25); padding: 7px 14px; border-radius: 99px; letter-spacing: .02em; }
  #take .log { position: absolute; left: 28px; bottom: 26px; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }
  .say { font: 600 28px Inter; letter-spacing: -.01em; color: var(--ink); background: #fff; padding: 14px 22px;
         border-radius: 22px 22px 22px 6px; display: flex; gap: 12px; align-items: center; white-space: nowrap;
         box-shadow: 0 16px 40px -16px rgba(0, 0, 0, .6); }
  .say.silky { background: var(--blue); color: #fff; border-radius: 22px 22px 6px 22px; font-weight: 500; }
  .say .w { display: inline-block; }
  .step { font: 600 19px Inter; color: #fff; background: rgba(37, 99, 235, .92); padding: 7px 14px; border-radius: 99px;
          white-space: nowrap; font-variant-numeric: tabular-nums; box-shadow: 0 10px 30px -10px rgba(0, 0, 0, .6); }
  .step b { font-weight: 800; }
  #takeHead { left: 188px; top: 44px; width: 1544px; height: 60px; }
  #takeHead .real { position: absolute; right: 0; top: 10px; display: flex; gap: 14px; align-items: center; }
  #takeHead .rec { width: 12px; height: 12px; border-radius: 50%; background: #EF4444; display: inline-block; margin-right: 8px; }

  #beats { left: 140px; top: 1000px; display: flex; gap: 12px; align-items: center; }
  #beats i { width: 56px; height: 5px; border-radius: 9px; background: var(--edge); display: block; }
  #beats span { font: 600 14px Inter; letter-spacing: .16em; color: var(--slate); text-transform: uppercase; margin-left: 10px; }
  .endc { left: 0; top: 0; width: 1920px; height: 1080px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; }
  #start { position: fixed; inset: 0; display: grid; place-items: center; color: #fff; font: 600 20px Inter; cursor: pointer; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
"use strict";
// ------------------------------------------------------------------ tools
const BLUE = "#2563EB", INK = "#0F172A", SLATE = "#64748B", LINE = "#CBD5E1", SOFT = "#DBEAFE", MIST = "#EFF6FF", EDGE = "#E2E8F0";
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, x) => a + (b - a) * x;
const p = (t, a, d) => clamp((t - a) / d);                   // progress of a move that starts at a and lasts d
const eo = (x) => 1 - Math.pow(1 - x, 3);
const eio = (x) => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const back = (x) => { const c = 1.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const win = (t, a, b, fi = .3, fo = .3) => Math.min(eo(p(t, a, fi)), 1 - eio(p(t, b - fo, fo)));  // in at a, out by b
const NS = "http://www.w3.org/2000/svg";
const stage = document.getElementById("stage");
function S(tag, attrs = {}, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function H(tag, cls, parent, html, style) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  if (style) Object.assign(e.style, style);
  (parent || stage).appendChild(e);
  return e;
}
const px = (v) => v + "px";
function show(el, a, transform) {          // opacity a; hidden entirely when a is ~0 so it costs nothing
  el.style.display = a < 0.002 ? "none" : "";
  el.style.opacity = a;
  if (transform != null) el.style.transform = transform;
}
function sshow(el, a, transform) {
  el.style.display = a < 0.002 ? "none" : "";
  el.setAttribute("opacity", a);
  if (transform != null) el.setAttribute("transform", transform);
}

// ------------------------------------------------------------------ timeline
let T = null;
const P = (id) => T.byId[id];               // a phrase {t0, t1, words} or a take {t0, t1, notes, cuts, ...}
const norm = (w) => w.toLowerCase().replace(/[^a-z0-9']/g, "");
// when a displayed word is spoken: the first unused spoken word that matches it, else just after the last one
function wordTimes(id, shown) {
  const said = P(id).words, out = [];
  let k = 0, last = P(id).t0 - 0.05;
  for (const w of shown) {
    let hit = -1;
    for (let j = k; j < said.length; j++) if (norm(said[j].w) === norm(w)) { hit = j; break; }
    if (hit >= 0) { last = said[hit].t0; k = hit + 1; } else last += 0.08;
    out.push(last);
  }
  return out;
}

// ------------------------------------------------------------------ kinetic lines
const lines = [];
// o: {id, x, y, size, parts: [[text, style]], align, out, dx, dy, weight, color, at (a fixed time instead of the speech)}
function kline(o) {
  const d = H("div", "kl", stage, null, { top: px(o.y), fontSize: px(o.size), fontWeight: o.weight || 800, color: o.color || INK });
  if (o.align === "center") Object.assign(d.style, { left: "0px", width: "1920px", textAlign: "center" });
  else d.style.left = px(o.x);
  const spans = [];
  for (const [text, style] of o.parts) for (const w of text.split(" ")) spans.push(H("span", "w" + (style ? " " + style : ""), d, w));
  const L = { o, d, spans, at: [] };
  lines.push(L);
  return L;
}
function timeLines() {
  for (const L of lines) {
    const shown = L.spans.map((s) => s.textContent);
    const at = typeof L.o.at === "function" ? L.o.at() : L.o.at;
    L.at = at != null ? shown.map((_, i) => at + i * (L.o.step ?? 0.07)) : wordTimes(L.o.id, shown);
    L.outAt = typeof L.o.out === "function" ? L.o.out() : L.o.out;
  }
}
function drawLines(t) {
  for (const L of lines) {
    if (t < L.at[0] - 0.1 || t > L.outAt + 0.5) { L.d.style.display = "none"; continue; }
    L.d.style.display = "";
    const e = eio(p(t, L.outAt, 0.35));
    L.d.style.opacity = 1 - e;
    L.d.style.transform = `translate(${(L.o.dx ?? 0) * e}px, ${(L.o.dy ?? -30) * e}px)`;
    L.spans.forEach((s, i) => {
      const a = eo(p(t, L.at[i] - 0.05, 0.26));
      const pop = s.classList.contains("e") ? lerp(1.18, 1, eo(p(t, L.at[i] - 0.05, 0.4))) : 1;
      s.style.opacity = a;
      s.style.transform = `translateY(${(1 - a) * 0.42}em) scale(${pop})`;
    });
  }
}

// ------------------------------------------------------------------ icons (drawn in a 100-unit box)
function icon(kind, parent, color = INK, w = 5) {
  const g = S("g", { fill: "none", stroke: color, "stroke-width": w, "stroke-linecap": "round", "stroke-linejoin": "round" }, parent);
  const d = {
    ear: "M30 40a22 22 0 1 1 40 12c-6 8-14 10-14 20a10 10 0 0 1-18 4 M42 42a8 8 0 1 1 14 6",
    brain: "M50 18v64 M50 26a14 14 0 0 0-26 6 14 14 0 0 0-6 24 14 14 0 0 0 12 22 12 12 0 0 0 20 4 M50 26a14 14 0 0 1 26 6 14 14 0 0 1 6 24 14 14 0 0 1-12 22 12 12 0 0 1-20 4",
    speaker: "M22 40h14l18-16v52L36 60H22z M66 38a16 16 0 0 1 0 24 M74 28a28 28 0 0 1 0 44",
    user: "M50 48a15 15 0 1 0 0-30 15 15 0 0 0 0 30z M22 82c4-16 16-24 28-24s24 8 28 24",
    cardi: "M16 28h68a6 6 0 0 1 6 6v34a6 6 0 0 1-6 6H16a6 6 0 0 1-6-6V34a6 6 0 0 1 6-6z M10 44h80 M24 62h18",
    mic: "M50 14a12 12 0 0 1 12 12v22a12 12 0 0 1-24 0V26a12 12 0 0 1 12-12z M28 46a22 22 0 0 0 44 0 M50 68v14 M38 84h24",
    doc: "M28 12h30l18 18v58H28z M58 12v18h18",
    eye: "M10 50s14-26 40-26 40 26 40 26-14 26-40 26S10 50 10 50z M50 62a12 12 0 1 0 0-24 12 12 0 0 0 0 24z",
    wave: "M22 50v0 M34 38v24 M46 26v48 M58 34v32 M70 42v16 M80 50v0",
    pause: "M38 30v40 M62 30v40",
    diamond: "M50 22l28 28-28 28-28-28z",
    bolt: "M54 14L26 56h22l-4 30 30-44H52z",
  }[kind];
  S("path", { d }, g);
  return g;
}

// ------------------------------------------------------------------ the world: laptop, cloud, network (beats 1, 2 and 5)
const world = S("svg", { width: 1920, height: 1080, viewBox: "0 0 1920 1080" });
stage.appendChild(world);
const cam = S("g", {}, world);
const LAP = { cx: 960, cy: 535 };
const lap = S("g", {}, cam);
const lapScreen = S("rect", { x: 680, y: 360, width: 560, height: 350, rx: 22, fill: "#fff", stroke: INK, "stroke-width": 4, pathLength: 1 }, lap);
const lapBase = S("path", { d: "M600 712h720l-26 22a14 14 0 0 1-9 4H635a14 14 0 0 1-9-4z", fill: "#fff", stroke: INK, "stroke-width": 4, "stroke-linejoin": "round", pathLength: 1 }, lap);
const lapNotch = S("path", { d: "M900 712h120v6a6 6 0 0 1-6 6h-108a6 6 0 0 1-6-6z", fill: EDGE }, lap);
const wave = S("g", {}, cam);
const waveBars = [...Array(9)].map((_, i) => S("rect", { x: -88 + i * 20, width: 10, rx: 5, fill: BLUE }, wave));
const cloud = S("g", {}, cam);
S("path", { d: "M-78 44h150a44 44 0 0 0 4-88 62 62 0 0 0-118-12A48 48 0 0 0-78 44z", fill: "#fff", stroke: INK, "stroke-width": 4, "stroke-linejoin": "round" }, cloud);
const servers = S("g", {}, cam);
for (let i = 0; i < 3; i++) {
  S("rect", { x: 0, y: i * 40, width: 92, height: 32, rx: 8, fill: "#fff", stroke: INK, "stroke-width": 3.5 }, servers);
  S("circle", { cx: 18, cy: i * 40 + 16, r: 4, fill: BLUE }, servers);
  S("path", { d: `M40 ${i * 40 + 16}h36`, stroke: LINE, "stroke-width": 4, "stroke-linecap": "round" }, servers);
}
const NET = [[1170, 420], [1330, 260], [1440, 250]];
const bez = (u) => { const [a, b, c] = NET; return [lerp(lerp(a[0], b[0], u), lerp(b[0], c[0], u), u), lerp(lerp(a[1], b[1], u), lerp(b[1], c[1], u), u)]; };
const packets = [...Array(16)].map(() => S("circle", { r: 4.5, fill: BLUE }, cam));
const lock = S("g", {}, cam);
S("rect", { x: -22, y: -6, width: 44, height: 34, rx: 8, fill: "#fff", stroke: INK, "stroke-width": 4 }, lock);
const shackle = S("path", { d: "M-12 -6v-10a12 12 0 0 1 24 0v10", fill: "none", stroke: INK, "stroke-width": 4, "stroke-linecap": "round" }, lock);
S("circle", { cx: 0, cy: 11, r: 3.5, fill: INK }, lock);
const models = ["ear", "brain", "speaker"].map((k, i) => {
  const g = S("g", {}, cam);
  icon(k, g, BLUE, 5).setAttribute("transform", "translate(-38 -50) scale(.76)");
  S("text", { y: 54, "text-anchor": "middle", "font-family": "Inter", "font-weight": 600, "font-size": 20, fill: SLATE }, g).textContent = ["hear", "think", "speak"][i];
  return g;
});
const fence = S("rect", { x: 560, y: 310, width: 800, height: 470, rx: 40, fill: "none", stroke: BLUE, "stroke-width": 4, "stroke-dasharray": "14 12" }, cam);
const fenceTag = H("div", "pill", stage, "on this laptop", { left: "590px", top: "290px" });
const ringOnLap = S("g", {}, cam);
S("circle", { r: 54, fill: "none", stroke: SOFT, "stroke-width": 10 }, ringOnLap);
const ringLapDot = S("circle", { r: 22, fill: BLUE }, ringOnLap);

// ------------------------------------------------------------------ the desktop (beats 2 and 3)
const desk = H("div", "", stage, null, { left: 0, top: 0, width: "1920px", height: "1080px", background: "#fff" });
const task = H("div", "", desk, null, { position: "absolute", left: 0, bottom: 0, width: "1920px", height: "64px", borderTop: "1.5px solid " + EDGE, background: "#FBFCFE" });
for (let i = 0; i < 5; i++) H("div", "", task, null, { position: "absolute", left: px(860 + i * 44), top: "18px", width: "28px", height: "28px", borderRadius: "8px", background: i === 2 ? SOFT : EDGE });

const ov = H("div", "", stage); ov.id = "overlay";
const ovRing = S("svg", { width: 76, height: 76, viewBox: "-38 -38 76 76" }); ov.appendChild(ovRing);
S("circle", { r: 30, fill: "none", stroke: SOFT, "stroke-width": 6 }, ovRing);
const ovArc = S("circle", { r: 30, fill: "none", stroke: BLUE, "stroke-width": 6, "stroke-linecap": "round", pathLength: 100, transform: "rotate(-90)", "stroke-dasharray": "0 100" }, ovRing);
const ovDot = S("circle", { r: 12, fill: BLUE }, ovRing);
const ovEye = icon("eye", ovRing, BLUE, 7); ovEye.setAttribute("transform", "translate(-17 -17) scale(.34)");
const ovTxt = H("div", "txt", ov);
H("div", "name", ovTxt, "SILKY");
const ovStatus = H("div", "status", ovTxt, "Listening");
const ovMeta = H("div", "meta", ovTxt);
const ovChip = H("span", "chip", ovMeta, "");

// ------------------------------------------------------------------ beat 1 type
kline({ id: "p1", x: 140, y: 118, size: 78, parts: [["Every time you", ""], ["talk", "e"]], out: () => P("p3").t0 - 0.35 });
kline({ id: "p2", x: 140, y: 210, size: 78, parts: [["your voice", ""], ["leaves the room.", "e"]], out: () => P("p3").t0 - 0.35, dx: 160, dy: 0 });
kline({ id: "p3", align: "center", y: 150, size: 104, parts: [["What if it", ""], ["didn't?", "e"]], out: () => P("p4").t0 - 0.6 });

// ------------------------------------------------------------------ beat 2
const wordmark = H("div", "kl", stage, 'Silky<span style="color:#2563EB">.</span>', { left: 0, width: "1920px", textAlign: "center", top: "430px", fontSize: "190px" });
kline({ id: "p5", x: 140, y: 300, size: 84, parts: [["Say its", ""], ["name.", "e"]], out: () => P("p6").t0 - 0.2 });
kline({ id: "p5", x: 140, y: 392, size: 84, parts: [["Say what you", ""], ["want.", "e"]], out: () => P("p6").t0 - 0.2 });
const bubble1 = H("div", "bubble", stage, "", { left: "140px", top: "560px" });
const micG = S("svg", { width: 34, height: 34, viewBox: "0 0 100 100" }); icon("mic", micG, BLUE, 8); bubble1.appendChild(micG);
H("span", "", bubble1, "“Silky, open the calculator”");
const calc = H("div", "win", stage, null, { left: "1010px", top: "270px", width: "400px", height: "600px" });
H("div", "bar", calc, '<i class="dot"></i><i class="dot"></i><i class="dot"></i><span style="margin-left:10px">Calculator</span>');
H("div", "", calc, "0", { font: "300 84px Inter", textAlign: "right", padding: "26px 30px 18px", letterSpacing: "-.03em" });
const keys = H("div", "", calc, null, { display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: "10px", padding: "0 22px" });
["C", "±", "%", "÷", "7", "8", "9", "×", "4", "5", "6", "−", "1", "2", "3", "+", "0", ".", "⌫", "="].forEach((k, i) =>
  H("div", "", keys, k, { height: "62px", borderRadius: "14px", display: "grid", placeItems: "center", font: "500 24px Inter",
    background: k === "=" ? BLUE : (i % 4 === 3 ? MIST : "#F1F5F9"), color: k === "=" ? "#fff" : (i % 4 === 3 ? BLUE : INK) }));
kline({ id: "p6", align: "center", y: 120, size: 76, parts: [["Models", ""], ["on your own laptop", "e"], ["do the rest.", ""]], out: () => P("p7").t0 - 0.35 });

// ------------------------------------------------------------------ beat 3a: the recorded takes
const takeHead = H("div", ""); takeHead.id = "takeHead";
const realTag = H("div", "real", takeHead, '<span class="pill"><i class="rec"></i>REAL RECORDING</span><span class="small">RTX 3050 laptop · real time · its own sound</span>');
const take = H("div", ""); take.id = "take";
const takeImg = H("img", "", take); takeImg.alt = "";
const flash = H("div", "flash", take);
const cutTag = H("div", "cut", take, "");
const log = H("div", "log", take);
kline({ id: "p7", x: 188, y: 50, size: 52, parts: [["Here it is,", ""], ["for real.", "e"]], out: () => P("F1").t0 + 0.25 });
kline({ id: "F1", x: 188, y: 50, size: 52, parts: [["Fix the grammar of", ""], ["what I selected", "e"]], at: () => P("F1").t0 + 0.3, out: () => P("p8").t0 - 0.2 });
kline({ id: "p8", x: 188, y: 50, size: 52, parts: [["It finds files by", ""], ["what they're about.", "e"]], out: () => P("F2").t0 + 0.4 });
kline({ id: "F2", x: 188, y: 50, size: 52, parts: [["Find files by", ""], ["meaning", "e"]], at: () => P("F2").t0 + 0.45, out: () => P("F2").t1 - 0.2 });
// camera moves inside the take, in the recording's own pixels (1920x1020): [shot seconds, centre x, centre y, zoom]
const MOVES = {
  grammar: [[0, 960, 510, 1], [3.7, 960, 510, 1], [4.8, 800, 400, 1.55]],
  files: [[0, 960, 510, 1], [4.7, 960, 510, 1], [5.7, 1715, 230, 2.25]],   // its overlay hides while the command is spoken
};
const camAt = (shot, s) => {
  const m = MOVES[shot];
  let i = 0; while (i < m.length - 1 && s >= m[i + 1][0]) i++;
  if (i === m.length - 1) return m[i].slice(1);
  const k = eio(clamp((s - m[i][0]) / (m[i + 1][0] - m[i][0])));
  return [1, 2, 3].map((j) => lerp(m[i][j], m[i + 1][j], k));
};
// the daemon's log for each take, as chips: built once the timeline is known
let logItems = [];
function buildLog() {
  for (const id of ["F1", "F2"]) {
    const f = P(id);
    const cmd = H("div", "say", log, "");

  // ---- beat 3: the recorded takes, then two quick scenes
  drawTake(t);
  const vign = (el, t0, t1) => {
    const i = eo(p(t, t0, 0.35)), o = eio(p(t, t1 - 0.3, 0.3));
    show(el, Math.min(i, 1 - o), `translateX(${(1 - i) * 90 - o * 90}px)`);
  };
  vign(s9, a("p9", -0.3), a("p10", -0.1));
  vign(s10, a("p10", -0.15), a("p11", -0.3));
  const prog = clamp((t - a("p9", -0.25)) / 1.75), pr = Math.pow(prog, 1.1);
  dlFill.style.width = (pr * 100).toFixed(2) + "%";
  dlPct.textContent = pr >= 1 ? "Download complete ✓" : `${Math.floor(pr * 100)}% · ${(pr * 2.4).toFixed(1)} of 2.4 GB`;
  dlPct.style.color = pr >= 1 ? BLUE : SLATE;
  show(memChip, eo(p(t, a("p10", 0.5), 0.25)), `scale(${lerp(.8, 1, back(p(t, a("p10", 0.5), 0.3)))})`);
  dials.forEach(({ strip, digit }, i) => {
    const spin = Math.max(0, a("p10", 0.9 + i * 0.2) - t), target = (digit + 9) % 10;
    strip.setAttribute("transform", `translate(0 ${-(spin > 0 ? (target + spin * 16) % 10 : target) * 150})`);
  });

  // ---- beat 4
  const pOn = win(t, a("p11", -0.15), a("p13", 0.5), 0.3, 0.5);
  const toCard = eio(p(t, a("p13", 0), 0.5));
  show(pipe, pOn, `translate(0px, ${toCard * 60}px) scale(${lerp(1, .55, toCard)})`);
  nodes.forEach((n, i) => {
    const k = back(p(t, a("p11", -0.1) + i * 0.07, 0.35));
    n.g.setAttribute("transform", `translate(${n.x} ${NY + (1 - clamp(k)) * 30})`); n.g.setAttribute("opacity", clamp(k * 1.4));
  });
  links.forEach((l, i) => l.setAttribute("stroke-dashoffset", 1 - eo(p(t, a("p11", 0) + i * 0.08, 0.35))));
  fastPath.setAttribute("stroke-dashoffset", 1 - eo(p(t, a("p11", 0.1), 0.4)));
  slowPath.setAttribute("stroke-dashoffset", 1 - eo(p(t, a("p11", 0.2), 0.4)));
  sshow(d1, eo(p(t, a("p11", 0.4), 0.25))); sshow(rtr, eo(p(t, a("p11", 0.35), 0.25)));
  const route = (t0, dur, fast) => {
    const u = p(t, t0, dur), arc = fast ? fastPath : slowPath, L = arc.getTotalLength();
    if (u <= 0 || u >= 1) return null;
    if (u < 0.45) return [lerp(260, 860, eio(u / 0.45)), NY, 0];
    if (u < 0.85) { const k = eio((u - 0.45) / 0.4), q = arc.getPointAtLength(k * L); return [q.x, q.y, k]; }
    return [lerp(1300, 1620, eio((u - 0.85) / 0.15)), NY, 1];
  };
  const r1 = route(a("p11", 0.2), 1.7, true), r2 = route(a("p12", -0.35), 1.7, false), r = r1 || r2;
  sshow(pulse, r ? 1 : 0); sshow(pulseGlow, r ? 1 : 0);
  if (r) for (const c of [pulse, pulseGlow]) { c.setAttribute("cx", r[0]); c.setAttribute("cy", r[1]); }
  fastHi.setAttribute("stroke-dasharray", `${r1 && r1[0] > 860 ? Math.min(1, r1[2]) : (t > a("p11", 1.9) ? 1 : 0)} 1`);
  slowHi.setAttribute("stroke-dasharray", `${r2 && r2[0] > 860 ? Math.min(1, r2[2]) : (t > a("p12", 1.35) ? 1 : 0)} 1`);
  nodes.forEach((n) => {
    const lit = [r1, r2].some((q) => q && Math.abs(q[0] - n.x) < 60 && Math.abs(q[1] - NY) < 5);
    n.c.setAttribute("stroke", lit ? BLUE : LINE);
  });
  const k1 = eo(p(t, a("p11", 1.3), 1.0)), k2 = eo(p(t, a("p12", 0.3), 1.1)), gone = 1 - eio(p(t, a("p13", -0.1), 0.3));
  show(count1, Math.min(eo(p(t, a("p11", 1.15), 0.25)), pOn, gone), `translateY(${(1 - eo(p(t, a("p11", 1.15), 0.25))) * 12}px)`);
  c1n.textContent = k1 >= 1 ? "0.08 s" : (0.077 * k1).toFixed(3).slice(0, 4) + " s";
  show(count2, Math.min(eo(p(t, a("p12", 0.15), 0.25)), pOn, gone), `translateY(${(1 - eo(p(t, a("p12", 0.15), 0.25))) * 12}px)`);
  c2n.textContent = (0.46 * k2).toFixed(2) + " s";
  show(pipeNote, Math.min(eo(p(t, a("p11", 2.3), 0.4)), gone));
  const gOn = win(t, a("p13", 0.2), a("p14", -0.25), 0.4, 0.3);
  show(gpu, gOn, `translateY(${(1 - eo(p(t, a("p13", 0.2), 0.4))) * 30}px) scale(${lerp(.96, 1, eo(p(t, a("p13", 0.2), 0.4)))})`);
  blades.setAttribute("transform", `rotate(${t * 240})`);
  blkLLM.style.width = (47.5 * eo(p(t, a("p13", 0.6), 0.5))) + "%";
  blkD1.style.width = (42.5 * eo(p(t, a("p13", 0.9), 0.5))) + "%";
  blkD1.style.borderLeftWidth = t < a("p13", 0.9) ? "0" : "3px";

  // ---- beat 5
  promises.forEach(({ id, c, slash }) => {
    const d = back(p(t, a(id, -0.05), 0.4)), out = eio(p(t, a("p17", -0.3), 0.4));
    show(c, Math.min(clamp(d * 1.5), 1 - out), `translateY(${(1 - d) * -60 - out * 50}px)`);
    slash.setAttribute("stroke-dashoffset", 1 - eo(p(t, a(id, 0.25), 0.3)));
  });
  const end = eo(p(t, T.end, 0.5));
  show(endc, end, `scale(${lerp(.97, 1, end)})`);
  show(endnote, end);

  // ---- beat bar (hidden over the recordings, which fill the frame)
  let bi = 0; T.beats.forEach((b, i) => { if (t >= b.t0) bi = i; });
  beatBars.forEach((b, i) => (b.style.background = i < bi ? "#93C5FD" : i === bi ? BLUE : EDGE));
  if (beatName.textContent !== T.beats[bi].label) beatName.textContent = T.beats[bi].label;
  const overTake = win(t, a("p7", 0.1), P("F2").t1 + 0.15, 0.3, 0.3);
  show(beatsEl, Math.min(eo(p(t, 0.5, 0.5)), 1 - eio(p(t, T.end - 0.25, 0.35)), 1 - overTake));

  drawLines(t);
}

// ------------------------------------------------------------------ entry points
function init(timeline) {
  T = timeline;
  T.byId = Object.fromEntries(T.items.map((x) => [x.id, x]));
  timeLines();
  buildLog();
  draw(0);
}
// resolves once the frame of the recording on screen has been decoded (render.mjs waits on it)
const settled = () => (take.style.display === "none" || !takeImg.src ? Promise.resolve() : takeImg.decode().catch(() => {}));
function fit() {
  const k = Math.min(innerWidth / 1920, innerHeight / 1080);
  stage.style.transform = `scale(${k})`;
  stage.style.marginRight = px(1920 * k - 1920); stage.style.marginBottom = px(1080 * k - 1080);
}
window.film = { init, draw, settled, ready: () => document.fonts.ready.then(() => document.fonts.check("800 40px Inter")) };

// preview: ?play plays the film with its sound; ?t=12.5 shows one frame
const q = new URLSearchParams(location.search);
if (q.has("play") || q.has("t")) {
  fit(); addEventListener("resize", fit);
  fetch("out/timeline.json").then((r) => r.json()).then(async (tl) => {
    await document.fonts.ready; init(tl);
    if (q.has("t")) return draw(Number(q.get("t")));
    const audio = new Audio("out/explainer.wav");
    const go = H("div", "", document.body, "Click to play (with sound)"); go.id = "start";
    go.onclick = () => { go.remove(); audio.play(); (function loop() { draw(audio.currentTime); if (!audio.ended) requestAnimationFrame(loop); })(); };
  });
}
</script>
