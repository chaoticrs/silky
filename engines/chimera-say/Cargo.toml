[package]
name = "chimera-say"
description = "Long-lived text-to-speech process around the CHIMERA engine: JSON lines in, WAV files out"
version = "0.1.0"
edition = "2024"

[dependencies]
chimera = { path = "../chimera-src/crates/chimera" }
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
